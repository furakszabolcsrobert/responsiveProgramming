<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS (használata nem kötelező) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Reszponzív formázás – Programozási nyelvek</title>
</head>
<body class="bg-blue-200 text-blue-900 font-bold">

    <!-- ===== MENÜ ===== -->
    <nav class="flex justify-between items-center max-w-6xl mx-auto px-4 rounded-xl  bg-blue-100 mt-6">
        <!-- Bal oldali rész -->
        <div class="flex items-center gap-2">
            <img src="code_logo.png" width="100" alt="Logo">
            <p>CodeHub</p>
        </div>

        <!-- Jobb oldali rész -->
        <div class="flex gap-6">
            <ul class="flex flex-row gap-6 items-center">
                <li>Python</li>
                <li>JavaScript</li>
                <li>Java</li>
                <li>C#</li>
            </ul>
        </div>
    </nav>


    <!-- ===== TARTALMI RÉSZ ===== -->
    <section class="">

        <!-- Címsor -->
        <div>
            <h1>Programozási nyelvek</h1>
        </div>

        <!-- Kártyák -->
        <div>

            <div>
                <div>
                    <img src="python.png" alt="Python">
                </div>
                <p>Python</p>
            </div>

            <div>
                <div>
                    <img src="javascript.png" alt="JavaScript">
                </div>
                <p>JavaScript</p>
            </div>

            <div>
                <div>
                    <img src="java.png" alt="Java">
                </div>
                <p>Java</p>
            </div>

            <div>
                <div>
                    <img src="csharp.png" alt="C#">
                </div>
                <p>C#</p>
            </div>

        </div>

    </section>

    <footer>
        <!-- opcionális -->
    </footer>

</body>
</html>
